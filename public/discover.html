<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Mizo — Explore · pick a chain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;800;900&family=Archivo:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="app.css"/>
</head>
<body data-page="discover">

<div class="page">

  <div class="phead">
    <div>
      <span class="kicker">✳ Explore · one chain at a time</span>
      <h1>PICK YOUR CHAIN</h1>
    </div>
    <span class="jp">選</span>
  </div>

  <div class="note" style="margin-bottom:14px"><b>Every launchpad is chain-native.</b> Pick where you want to dig — browse the wall, buy tokens, and launch your own inside that chain&rsquo;s bin.</div>

  <div class="pick-grid" id="pickGrid"></div>

  <footer class="ft"></footer>
</div>

<script src="app.js"></script>
<script>
(function(){
  const PICK = [
    ['hood','ROBINHOOD','林','#c9f73a','2,140 tokens live','$455.3M 24h vol'],
    ['base','BASE','基','#2334ff','1,872 tokens live','$688.0M 24h vol'],
    ['eth','ETHEREUM','乙','#8791ff','3,406 tokens live','$2.31B 24h vol'],
    ['ton','TON','頓','#31a6ea','904 tokens live','$1.95B 24h vol'],
    ['sol','SOLANA','太','#9a5cff','5,530 tokens live','$455.3M 24h vol'],
    ['bnb','BSC','幣','#f0b90b','1,218 tokens live','$402.6M 24h vol'],
  ];
  document.getElementById('pickGrid').innerHTML = PICK.map(([slug,name,kanji,color,live,vol],i)=>
    `<a class="pick" href="chain.html?c=${slug}" style="--pk:${color}">
      <span class="pk-bar"></span>
      <div class="pk-top"><span class="pk-kanji">${kanji}</span><span class="pk-idx">CH·${String(i+1).padStart(2,'0')}</span></div>
      <div class="pk-name">${name}</div>
      <div class="pk-stats">${live} · ${vol}</div>
      <div class="pk-enter">Enter launchpad <span>→</span></div>
    </a>`).join('');
})();
</script>
</body>
</html>
