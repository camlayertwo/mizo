<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Mizo — Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;800;900&family=Archivo:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="v6.css"/>
</head>
<body data-page="bridge">
<div class="page task-page">
  <main class="trade-stage">
    <div class="bridge-layout">
      <section class="trade-card" aria-label="Bridge assets">
        <div class="trade-head">
          <div class="trade-title"><span class="trade-icon">⌒</span><span>Bridge</span></div>
          <button class="fee-chip">⚙ 0.5%</button>
        </div>

        <div class="asset-box">
          <div class="asset-meta"><span>From</span><span>Balance 4.20 ETH</span></div>
          <div class="asset-main"><span class="asset-amount">1.00</span><button class="asset-pick"><i class="coin eth">◆</i><span><b>ETH</b><small>Ethereum</small></span><em>⌄</em></button></div>
        </div>
        <button class="asset-flip" aria-label="Switch chains">⇅</button>
        <div class="asset-box">
          <div class="asset-meta"><span>To</span><span>≈ 0.99 ETH</span></div>
          <div class="asset-main"><span class="asset-amount">0.99</span><button class="asset-pick"><i class="coin hood">M</i><span><b>ETH</b><small>Robinhood</small></span><em>⌄</em></button></div>
        </div>

        <label class="address-field"><span>Receiving wallet</span><input placeholder="0x… destination on Robinhood"/></label>
        <label class="check-row"><input type="checkbox"/> Use connected wallet address</label>
        <div id="brCta"><button class="btn btn-accent block">Review bridge</button></div>
      </section>

      <aside class="route-panel" id="brSide">
        <div class="route-head"><b>Route</b><span><button class="on">Best</button><button>Fastest</button></span></div>
        <div class="route-steps">
          <div class="on"><i>1</i><span><b>Connect wallet</b><small>Link a wallet to unlock live quotes</small></span></div>
          <div><i>2</i><span><b>Enter amount</b><small>Choose the asset and destination chain</small></span></div>
          <div><i>3</i><span><b>Review &amp; bridge</b><small>Confirm the best route in one signature</small></span></div>
        </div>
      </aside>
    </div>

    <div class="prototype-states" aria-label="Prototype states">
      <span>Preview state</span>
      <button data-state="quoting">Ready</button><button data-state="flight">In flight</button><button data-state="complete">Complete</button><button data-state="stuck">Delayed</button>
    </div>
  </main>
</div>
<script src="v6.js"></script>
<script>
  const CTA=document.getElementById('brCta'), SIDE=document.getElementById('brSide'), base=SIDE.innerHTML;
  const V={
    quoting:()=>{CTA.innerHTML='<button class="btn btn-accent block">Review bridge</button>';SIDE.innerHTML=base;},
    flight:()=>{CTA.innerHTML='<button class="btn btn-accent block" disabled>Bridge in progress · 40s</button>';SIDE.innerHTML='<div class="route-head"><b>Route status</b><span class="status-live">Live</span></div><div class="route-progress"><div class="spin"></div><b>Moving 1.00 ETH</b><small>Ethereum → Robinhood</small><div class="progress"><i style="inset:0 42% 0 0"></i></div><small>Signed · solver routing</small></div>';},
    complete:()=>{CTA.innerHTML='<button class="btn btn-accent block">Bridge again</button>';SIDE.innerHTML='<div class="route-head"><b>Route status</b><span class="status-live">Done</span></div><div class="route-progress"><div class="done">✓</div><b>0.99 ETH arrived</b><small>Ethereum → Robinhood · 40s</small><button class="btn btn-ghost sm">View in portfolio</button></div>';},
    stuck:()=>{CTA.innerHTML='<button class="btn btn-ghost block">View on explorer</button>';SIDE.innerHTML='<div class="route-head"><b>Route status</b><span class="status-warn">Delayed</span></div><div class="route-progress"><div class="fail">!</div><b>Taking longer than usual</b><small>Source confirmed · destination pending</small><p>Funds are safe. This status updates automatically.</p></div>';}
  };
  document.querySelectorAll('.prototype-states button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.prototype-states button').forEach(x=>x.classList.toggle('on',x===b));V[b.dataset.state]();}));
  document.querySelector('.prototype-states button').click();
</script>
</body>
</html>
