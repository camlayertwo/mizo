<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Mizo — Swap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;800;900&family=Archivo:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="app.css"/>
</head>
<body data-page="swap">
<div class="page task-page">
  <main class="trade-stage trade-stage-single">
    <section class="trade-card" aria-label="Swap tokens">
      <div class="trade-head">
        <div class="trade-title"><span class="trade-icon">⇄</span><span>Swap</span></div>
        <button class="icon-btn" aria-label="Swap settings">⚙</button>
      </div>

      <div class="trade-mode" role="tablist" aria-label="Swap mode">
        <button class="on">Private swap<span>MEV protected</span></button>
        <button>Simple swap<span>Fast · public</span></button>
      </div>

      <div class="asset-box">
        <div class="asset-meta"><span>Sell</span><span>Balance 4.20 ETH</span></div>
        <div class="asset-main"><span class="asset-amount">1.00</span><button class="asset-pick"><i class="coin eth">◆</i><span><b>ETH</b><small>Ethereum</small></span><em>⌄</em></button></div>
      </div>
      <button class="asset-flip" aria-label="Switch assets">⇅</button>
      <div class="asset-box">
        <div class="asset-meta"><span>Buy</span><span id="rcvSub">Balance 0 TON</span></div>
        <div class="asset-main"><span class="asset-amount" id="rcvAmt">182.4</span><button class="asset-pick"><i class="coin ton">T</i><span><b>TON</b><small>TON</small></span><em>⌄</em></button></div>
      </div>

      <div class="trade-summary" id="swSummary">
        <div><span>Rate</span><b>1 ETH ≈ 182.4 TON</b></div>
        <div><span>Route</span><b id="swRoute">Best · 1 hop</b></div>
        <div><span>Network cost</span><b>Paid from output</b></div>
      </div>
      <div id="swCta"><button class="btn btn-accent block">Review swap</button></div>
    </section>
    <p class="trade-footnote">Non-custodial · every swap is signed in your wallet.</p>

    <div class="prototype-states" aria-label="Prototype states">
      <span>Preview state</span>
      <button data-state="quote">Ready</button><button data-state="loading">Loading</button><button data-state="insufficient">Low balance</button><button data-state="unavailable">No route</button>
    </div>
  </main>
</div>
<script src="app.js"></script>
<script>
  const R=document.getElementById('swRoute'), A=document.getElementById('rcvAmt'), S=document.getElementById('rcvSub'), CTA=document.getElementById('swCta');
  const V={
    quote:()=>{R.textContent='Best · 1 hop';A.textContent='182.4';S.textContent='Balance 0 TON';CTA.innerHTML='<button class="btn btn-accent block">Review swap</button>';},
    loading:()=>{R.innerHTML='Finding route <span class="blink">▮</span>';A.textContent='···';S.textContent='Quoting…';CTA.innerHTML='<button class="btn btn-accent block" disabled>Fetching quote…</button>';},
    insufficient:()=>{R.textContent='Best · 1 hop';A.textContent='182.4';S.textContent='Balance 0 TON';CTA.innerHTML='<button class="btn btn-accent block" disabled>Insufficient ETH balance</button>';},
    unavailable:()=>{R.textContent='No route available';A.textContent='—';S.textContent='Try another token';CTA.innerHTML='<button class="btn btn-accent block" disabled>Route unavailable</button>';}
  };
  document.querySelectorAll('.prototype-states button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.prototype-states button').forEach(x=>x.classList.toggle('on',x===b));V[b.dataset.state]();}));
  document.querySelector('.prototype-states button').click();
  document.querySelectorAll('.trade-mode button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.trade-mode button').forEach(x=>x.classList.toggle('on',x===b));}));
</script>
</body>
</html>
