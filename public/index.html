<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Mizo — swap, bridge, explore, launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;800;900&family=Archivo:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="app.css"/>
</head>
<body data-page="home">

<div class="page">

  <!-- ===== WORDMARK ROW: big MIZO + filler image right ===== -->
  <div class="markrow">
    <div class="wordmark">
      <!-- Cam's exported wordmark (mizo-wordmark.svg). Figma Texture (4.04/1.01) = noise-driven
           displacement of the rendered layer (wobbly edges, solid fill) — recreated with
           feTurbulence -> feDisplacementMap + CSS mix-blend-mode:difference. -->
      <svg class="mizo-mark" viewBox="0 0 1107 249" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MIZO">
        <defs>
          <filter id="wm-tex" x="-3%" y="-8%" width="106%" height="116%">
            <feTurbulence type="fractalNoise" baseFrequency="0.45" numOctaves="2" seed="7" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
        </defs>
        <path filter="url(#wm-tex)" fill="#AFA69C" d="M183.836 111.429L275.481 0H364.826V248.182H268.745V153.101L186.845 248.182H177.627L96.082 153.149V248.182H0V0H88.9912L183.836 111.429ZM478.68 248.182H382.599V0H478.68V248.182ZM787.217 65.8701L638.863 179.754H787.217V248.182H495.427V182.299L643.426 68.4268H495.427V0H787.217V65.8701ZM1107 32.6182V215.563L1074.38 248.182H836.482L803.864 215.563V32.6182L836.482 0H1074.38L1107 32.6182ZM899.946 74.8086V173.372L906.328 179.754H1004.54L1010.92 173.372V74.8086L1004.54 68.4268H906.328L899.946 74.8086Z"/>
      </svg>
    </div>
    <div class="mark-img"><img src="art/city-comic.png" alt="MIZO city"></div>
  </div>

  <!-- ===== MARQUEE: platform info, placeholder content ===== -->
  <div class="marquee"><div class="mq-track" id="mqTrack"></div></div>

  <!-- ===== HERO: character (bleeds up) · verbs panel · circles + image column ===== -->
  <section class="hero">
    <div class="hero-char">
      <div class="char-bg"><img src="art/character-bg.png" alt=""></div>
      <div class="char-fig"><img src="art/mizo-character.png" alt="MIZO character"></div>
    </div>

    <div class="hero-main">
      <div class="hm-bar">
        <div>System 001</div>
        <div><span class="ast" style="color:var(--accent)">✳</span></div>
        <div class="jp">ポータル</div>
        <div class="blocks">▚▞▚ ▞▚▞</div>
        <div id="clock">—:—:—</div>
      </div>
      <div class="hero-verbs" id="verbs">
        <div class="verb on"><a href="swap.html">SWAP</a><span class="arw">←</span></div>
        <div class="verb"><a href="bridge.html">BRIDGE</a><span class="arw">←</span></div>
        <div class="verb"><a href="discover.html">EXPLORE</a><span class="arw">←</span></div>
        <div class="verb"><a href="launch.html">LAUNCH</a><span class="arw">←</span></div>
      </div>
      <div class="hero-chevrons">&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;</div>
      <div class="hero-foot">
        <span class="lead">Across every chain</span>
        <span class="jp">イブ・アーツ</span>
      </div>
    </div>

    <div class="hero-side">
      <div class="side-circles">
        <svg class="circles" viewBox="0 0 100 100">
          <circle class="ring" cx="50" cy="50" r="6"/><circle class="ring" cx="50" cy="50" r="13"/><circle class="ring" cx="50" cy="50" r="20"/>
          <circle class="ring" cx="50" cy="50" r="27"/><circle class="ring" cx="50" cy="50" r="34"/><circle class="ring" cx="50" cy="50" r="41"/><circle class="ring" cx="50" cy="50" r="48"/>
        </svg>
        <span class="vtxt">レネサンス</span>
      </div>
      <div class="side-img"><img src="art/chain-map.png" alt="MIZO chain map"></div>
    </div>
  </section>

  <!-- ===== MIZO'S COLLECTION: top coins per chain, tabbed ===== -->
  <section class="collection" id="collection">
    <div class="col-head">
      <h2>MIZO&rsquo;S COLLECTION</h2>
      <span>Top performing by chain</span>
    </div>
    <div class="chain-tabs" id="chainTabs"></div>
    <div class="cards" id="cards"></div>
  </section>

  <footer class="ft"></footer>
</div>

<script src="app.js"></script>
<script>
/* ---------- marquee (placeholder platform facts) ---------- */
const MQ = [
  '<span class="ast">✳</span> Swap across 6 chains','<span class="jp">ポータル</span>','Pool $18.2M','$GISM',
  '<span class="blk">▚▞▚▞</span>','Boot sequence initiated','<span class="ast">✳</span>','Swap across',
  '<span class="jp">ミゾ</span>','1,840 swaps today','Bridged $4.2M','312 launches this week',
];
const mqOne = MQ.map(t=>`<span>${t}</span>`).join('');
document.getElementById('mqTrack').innerHTML = mqOne + mqOne;

/* ---------- live clock in hero bar ---------- */
function tickClock(){
  const d = new Date();
  let h = d.getHours(); const ap = h>=12?'PM':'AM'; h = h%12||12;
  document.getElementById('clock').textContent =
    `${String(h).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')} ${ap}`;
}
tickClock(); setInterval(tickClock, 1000);

/* ---------- hero verb hover: arrow follows ---------- */
document.querySelectorAll('#verbs .verb').forEach(v=>{
  v.addEventListener('mouseenter', ()=>{
    document.querySelectorAll('#verbs .verb').forEach(x=>x.classList.remove('on'));
    v.classList.add('on');
  });
});

/* ---------- collection: tabs + token cards (placeholder data) ---------- */
const COLL = {
  ROBINHOOD:[['Mini Cate','MIC','2M','$73K','猫',1],['The Bear Flop','TBF','5H','$9.8K','熊',1],['Mini Cate','GUMBALL','5H','$9.8K','緑',1],['Chrome','CHR','5H','$9.8K','鉻',1],['Pons','PONS','5H','$9.8K','P',1],['Jesus Loves You','MIC','5H','$9.8K','愛',1]],
  SOLANA:[['Night Pressing','NGHT','9H','$1.2M','夜',1],['Deep Cut','DEEP','5H','$140K','深',-1],['Solar Flare','FLARE','1H','$88K','陽',1],['Grid Runner','GRID','3H','$54K','格',1],['Test Press','TSTP','7M','$6K','試',-1],['Wax Stack','WAX','2H','$31K','蝋',1]],
  ETHEREUM:[['Obi Standard','OBI','1D','$3.4M','帯',1],['White Label','WLBL','12H','$610K','白',1],['First Press','FRST','6H','$402K','初',-1],['Blue Note','BLUE','4H','$120K','青',1],['Mast Cut','MAST','9H','$77K','桅',1],['Inner Groove','INGR','2H','$45K','溝',-1]],
  TON:[['Test Press','TSTP','7M','$6K','試',1],['Open Air','OAIR','3H','$18K','空',1],['Tone Arm','TONE','5H','$12K','腕',-1],['Blue Bird','BIRD','8H','$9.1K','鳥',1],['Cold Wave','COLD','1H','$7.7K','冷',1],['Echo Unit','ECHO','2H','$5.2K','響',-1]],
  BASE:[['B-Side','BSIDE','41M','$88K','裏',1],['Base Layer','LAYR','5H','$66K','層',1],['Blue Print','BPRT','2H','$41K','図',-1],['Dry Run','DRY','6H','$28K','乾',1],['Half Speed','HALF','3H','$19K','半',1],['Cut Master','CUTM','9H','$14K','匠',-1]],
  BSC:[['Cut Sleeve','CUTS','3H','$21K','切',1],['Gold Stamp','GOLD','4H','$17K','金',1],['Yellow Vinyl','YLLW','7H','$11K','黄',-1],['Bin Diver','BIN','1H','$8.4K','箱',1],['Loud Cut','LOUD','5H','$6.9K','響',1],['Street Date','DATE','8H','$4.4K','街',-1]],
};
let curChain = 'ROBINHOOD';
function renderTabs(){
  document.getElementById('chainTabs').innerHTML = Object.keys(COLL).map(c=>
    `<button class="ctab${c===curChain?' on':''}" data-chain="${c}">${c}</button>`).join('');
}
document.getElementById('chainTabs').addEventListener('click', e=>{
  const b = e.target.closest('.ctab'); if(b) setChain(b.dataset.chain);
});
function setChain(c){ curChain = c; renderTabs(); renderCards(); }
function renderCards(){
  document.getElementById('cards').innerHTML = COLL[curChain].map(([name,tkr,age,mc,kanji,dir],i)=>
    `<a class="card" href="record.html">
      <div class="card-img" style="background:linear-gradient(150deg,${HUES[i%6]}55,#181815 80%)">
        <span class="kanji">${kanji}</span><span class="mint-tag">MINT</span>
      </div>
      <div class="card-body">${name}</div>
      <div class="card-foot">
        <span class="tkr">$${tkr}</span>
        <span class="chg${dir<0?' dn':''}">⚘ ${age}</span>
        <span class="mc">${mc}</span>
      </div>
    </a>`).join('');
}
renderTabs(); renderCards();
</script>
</body>
</html>
